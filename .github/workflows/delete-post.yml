name: Delete Instagram Post

on:
  workflow_dispatch:
    inputs:
      media_id:
        description: "The Media ID of the post to delete"
        required: true
        type: string

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete post
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_ID: ${{ inputs.media_id }}
        run: |
          curl -s -X DELETE "https://graph.instagram.com/v21.0/${MEDIA_ID}?access_token=${IG_ACCESS_TOKEN}"
