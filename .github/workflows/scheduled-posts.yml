name: Scheduled Instagram posts

# Posts any folder in posts/ whose date and time has arrived.
# Runs whenever something is added to posts/, every 30 minutes,
# and on demand from the Actions tab.
on:
  push:
    branches: [main]
    paths: ["posts/**"]
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-posting
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Publish posts that are due
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
        run: |
          git config user.name "Instagram poster"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          python publish_due_posts.py
